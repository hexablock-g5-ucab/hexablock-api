commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.ts"
      run: npx oxlint {staged_files}
    format:
      glob: "*.ts"
      run: npx prettier --check {staged_files}

pre-push:
  commands:
    tests:
      run: npm test
