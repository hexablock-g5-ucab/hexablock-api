# Local PostgreSQL for development and e2e tests. Run the API with `npm run start:dev`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hexablock
      POSTGRES_PASSWORD: hexablock
      POSTGRES_DB: hexablock
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
volumes:
  db-data:
