services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hexablock
      POSTGRES_PASSWORD: hexablock
      POSTGRES_DB: hexablock
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hexablock:hexablock@db:5432/hexablock?schema=public
    ports: ["3000:3000"]
    depends_on: [db]
volumes:
  db-data:
