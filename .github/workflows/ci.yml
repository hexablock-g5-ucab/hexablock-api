name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: hexablock, POSTGRES_PASSWORD: hexablock, POSTGRES_DB: hexablock_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hexablock:hexablock@localhost:5432/hexablock_test?schema=public
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test -- --coverage
      - run: npx prisma migrate deploy
      - run: npm run test:e2e
      - run: npm run build
